name: Release

# Tag pushes publish a macOS release. Local preparation never creates a tag.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check build environment
        run: |
          sw_vers
          xcodebuild -version

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "Expected vX.Y.Z or vX.Y.Z-beta.N"
            exit 1
          fi
          # CFBundleShortVersionString stays numeric for beta releases too.
          echo "KEYSTATS_RELEASE_VERSION=${VERSION%%-beta.*}" >> "$GITHUB_ENV"

      - name: Test release tooling
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Run core tests
        run: swift test

      - name: Verify vendored helper
        run: ./scripts/check_vendored_helper.sh

      - name: Build macOS artifacts
        run: ./scripts/build_dmg.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            build/ReleasePackaging/output/Keytide.dmg
            build/ReleasePackaging/output/Keytide.zip
            build/ReleasePackaging/output/SHA256SUMS
          if-no-files-found: error

  create-release:
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: release-assets

      - name: Verify artifact checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/Keytide.dmg
            release-assets/Keytide.zip
            release-assets/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
          make_latest: ${{ contains(github.ref_name, '-beta.') && 'false' || 'true' }}
          body: |
            macOS release with manual updates: download a new version from this repository's Releases page.
            This build uses ad-hoc signing and is not Apple-notarized.
            In-app Sparkle updates are disabled; this release does not publish an appcast.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
